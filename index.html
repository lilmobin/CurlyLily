<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4A1F2B">
  <title>for Curly Lily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage" class="phase-intro" aria-label="for Curly Lily">

    <!-- Layer 0: atmosphere (pure CSS) -->
    <div class="bg" aria-hidden="true">
      <div class="bg__base"></div>
      <div class="bg__cloud bg__cloud--a"></div>
      <div class="bg__cloud bg__cloud--b"></div>
      <div class="bg__cloud bg__cloud--c"></div>
      <div class="bg__grain"></div>
      <div class="bg__dark"></div>
    </div>

    <!-- Layer 1: light trails + particles + flower (canvas) -->
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- Layer 2: title PNG (yours) -->
    <div class="title" id="title">
      <img id="titleImg" src="assets/title.png" alt="for Curly Lily" draggable="false">
    </div>

    <!-- Layer 3: loading card -->
    <div class="loader" id="loader" aria-live="polite">
      <p class="loader__label">Loading...</p>
      <div class="loader__track">
        <div class="loader__fill" id="loaderFill"></div>
        <div class="loader__dot" id="loaderDot"></div>
      </div>
      <svg class="loader__spark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 L13.6 10.4 L22 12 L13.6 13.6 L12 22 L10.4 13.6 L2 12 L10.4 10.4 Z"
              fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>
    </div>

    <!-- Layer 4: music player -->
    <section class="player" id="player" aria-label="Music player">
      <div class="player__top">
        <div class="player__cover" id="cover"></div>
        <div class="player__meta">
          <div class="player__title" id="songTitle">Nightwave</div>
          <div class="player__artist" id="songArtist">M83</div>
        </div>
        <button class="icon-btn heart" id="heartBtn" aria-label="Like" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.3C1.6 8 3.4 5 6.5 5c2 0 3.7 1.2 5.5 3.3C13.8 6.2 15.5 5 17.5 5c3.1 0 4.9 3 3.8 6.2-1.8 4.7-9.3 9.3-9.3 9.3z"/></svg>
        </button>
      </div>

      <div class="player__progress">
        <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar__fill" id="barFill"></div>
          <div class="bar__knob" id="barKnob"></div>
        </div>
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>

      <div class="player__controls">
        <button class="icon-btn" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 3.8c1.1 1.6 2.3 2.6 4.3 2.6H21M3 17h3.5c2 0 3.2-1 4.3-2.6M13.2 8.6C14.3 7.6 15.5 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/></svg>
        </button>
        <button class="icon-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" class="solid"><path d="M6 5v14M19 5.5v13L9 12z"/></svg>
        </button>
        <button class="play" id="playBtn" aria-label="Play">
          <svg class="ic-play" viewBox="0 0 24 24"><path d="M9 6.5v11l9-5.5z"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" class="solid"><path d="M18 5v14M5 5.5v13L15 12z"/></svg>
        </button>
        <button class="icon-btn" id="repeatBtn" aria-label="Repeat" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 11V9.5A2.5 2.5 0 0 1 6.5 7H20M17 4l3 3-3 3M20 13v1.5a2.5 2.5 0 0 1-2.5 2.5H4M7 14l-3 3 3 3"/></svg>
        </button>
      </div>
    </section>

    <audio id="audio" preload="metadata" playsinline></audio>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
